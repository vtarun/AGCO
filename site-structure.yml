site:
  name: Recrunomic – Smart HR & Recruitment Solutions
  brand:
    colors:
      green: "#2E8B57"
      ivory: "#FAF9F6"
      gold: "#D4AF37"
      charcoal: "#333333"
  navigation:
    - label: What We Offer
      href: /#what-we-offer
    - label: Who We Serve
      href: /#who-we-serve
